services:
  landing:
    build:
      context: ./landing-page
    container_name: landing-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
      - VITE_CHAT_URL=https://chat.prodmate.dev/
    volumes:
      - ./landing-page:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

  chat:
    build:
      context: ./chat-page
    container_name: chat-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
    volumes:
      - ./chat-page:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    command: npm run dev
